name: moss-eval-ci

on:
  push:
  pull_request:

jobs:
  unit-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: npm ci --no-audit
      - run: npm run check
      - run: npm test
      - run: npm run calibrate
      - run: npm run doctor
      - run: npm run smoke
